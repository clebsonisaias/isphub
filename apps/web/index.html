<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISPhub</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0d1013" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Técnico NetGO" />
    <!--
      CSP do app web. O ponto que importa e `script-src 'self'` SEM
      'unsafe-inline': o token de sessao mora em localStorage desta origem, e
      sem isto qualquer HTML que virasse um documento same-origin (ex.: um
      blob: criado a partir de bytes vindos do SGP de um provedor) executava
      script com acesso a ele. `object-src 'none'` e `base-uri 'self'` fecham
      os desvios classicos; `frame-ancestors 'none'` impede clickjacking.
      connect-src fica permissivo porque a URL da API e definida no build.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script src="/tema.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
